<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e4e7ec; --text:#111827; --muted:#6b7280;
    --accent:#1d4ed8; --accent-soft:#eef4ff;
    --green:#059669; --green-bg:#ecfdf5; --amber:#b45309; --amber-bg:#fffbeb;
    --red:#dc2626; --red-bg:#fef2f2; --grey:#4b5563; --grey-bg:#f3f4f6;
    --radius:12px;
    /* Bauhaus 93 is used when it is installed (Windows / MS Office); Righteous is the web stand-in */
    --display:"Bauhaus 93","Righteous","Plus Jakarta Sans",sans-serif;
    --ink:#0b1222; --ink2:#111f3a; --line-dk:#1e2d4a; --cyan:#38bdf8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
       background:var(--bg);
       background-image:radial-gradient(circle at 1px 1px, rgba(15,23,42,.06) 1px, transparent 0);
       background-size:22px 22px;
       color:var(--text);font-size:14.5px;line-height:1.55;
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit}

  .app{display:flex;min-height:100vh}
  .sidebar{width:240px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;
           padding:20px 12px;color:#cbd5e1;border-right:1px solid var(--line-dk);
           background-image:linear-gradient(175deg,var(--ink) 0%,var(--ink2) 62%,#16264a 100%),
             repeating-linear-gradient(90deg,rgba(56,189,248,.05) 0 1px,transparent 1px 34px),
             repeating-linear-gradient(0deg,rgba(56,189,248,.05) 0 1px,transparent 1px 34px)}
  .brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
         padding:4px 8px 18px;color:#fff;font-family:var(--display);font-weight:400;
         font-size:24px;line-height:1.05;letter-spacing:.02em}
  .brand .logo{height:86px;width:auto;flex-shrink:0;display:block;
               filter:drop-shadow(0 5px 14px rgba(56,189,248,.38))}
  .brand small{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;
               color:var(--cyan);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-top:7px}
  .yearbox{padding:0 6px 14px;border-bottom:1px solid var(--line-dk);margin-bottom:12px}
  .yearbox label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#64748b;font-weight:700}
  .yearbox select{width:100%;margin-top:6px;padding:8px 9px;border:1px solid #24365a;border-radius:9px;
                  background:#0d1729;color:#e2e8f0;font-weight:700}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:7px 11px;
              border:0;border-left:3px solid transparent;background:none;border-radius:9px;
              color:#94a3b8;font-weight:600;font-size:13.5px;transition:.15s}
  .nav button:hover{background:rgba(148,163,184,.10);color:#fff}
  .nav button:hover .ic{transform:translateY(-1px)}
  .nav button.on{color:#fff;border-left-color:var(--c);
                 background:linear-gradient(90deg,var(--cb),transparent)}
  .nav .ic{width:29px;height:29px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;
           font-size:14.5px;line-height:1;color:var(--c);background:var(--cb);
           border:1px solid transparent;transition:.15s}
  .nav button.on .ic{background:var(--c);color:#08111f;border-color:rgba(255,255,255,.35);
                     box-shadow:0 0 0 3px var(--cb), 0 3px 10px var(--cb)}
  .main{flex:1;padding:26px 30px 70px;max-width:1180px;min-width:0}

  h1{font-family:var(--display);font-size:31px;font-weight:400;margin:0 0 4px;letter-spacing:.015em}
  h2{font-family:var(--display);font-size:19px;font-weight:400;margin:30px 0 11px;letter-spacing:.015em}
  .sub{color:var(--muted);margin:0 0 20px;font-size:13.5px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .spread{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .pad{padding:16px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px 16px;
        position:relative;overflow:hidden}
  .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
                background:linear-gradient(90deg,var(--accent),var(--cyan))}
  .stat .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
  .stat .value{font-family:var(--display);font-size:39px;font-weight:400;line-height:1.05;margin-top:7px;
               letter-spacing:.01em;font-variant-numeric:tabular-nums;
               background:linear-gradient(135deg,var(--accent),var(--cyan));
               -webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .foot{font-size:12px;color:var(--muted)}

  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .p-open{background:var(--accent-soft);color:var(--accent)}
  .p-done{background:var(--green-bg);color:var(--green)}
  .p-draft{background:var(--grey-bg);color:var(--grey)}
  .p-closed{background:var(--amber-bg);color:var(--amber)}
  .p-out{background:var(--red-bg);color:var(--red)}
  .lvl{font-size:11.5px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .award{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;padding:1px 7px;border-radius:6px;
         font-size:11.5px;font-weight:600;display:inline-block;margin:2px 3px 0 0}

  .btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;font-weight:600}
  .btn:hover{background:var(--grey-bg)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(.92)}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px;font-weight:500}
  .btn.danger{color:var(--red)}
  .chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
  .chip.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:600}
  .search{padding:8px 12px;border:1px solid var(--line);border-radius:9px;min-width:210px;background:var(--card)}

  .list{display:flex;flex-direction:column}
  .item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 16px;
        border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:0}
  .item:hover{background:#fafbfc}
  .item .title{font-weight:700;letter-spacing:-.015em}
  .item .meta{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .count{font-family:var(--display);font-size:21px;font-weight:400;white-space:nowrap;text-align:right;
         letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--accent)}
  .count span{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
     font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line)}
  td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr.entry{cursor:pointer}
  tr.entry:hover td{background:#fafbfc}
  tr.expand td{background:#fbfcfd;color:var(--muted);font-size:13px}
  .avatars{display:flex}
  .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
      display:grid;place-items:center;font-size:10px;font-weight:700;border:2px solid #fff;margin-left:-7px}
  .av:first-child{margin-left:0}
  .empty{padding:32px;text-align:center;color:var(--muted)}
  .grip{cursor:grab;color:#c3c8d0;font-size:17px;line-height:1;padding:2px 4px;user-select:none;flex-shrink:0}
  .grip:active{cursor:grabbing}
  .item.dragging{opacity:.35}
  .item.over-top{box-shadow:inset 0 3px 0 var(--accent)}
  .item.over-bot{box-shadow:inset 0 -3px 0 var(--accent)}
  .ord{display:flex;flex-direction:column;gap:2px}
  .ord button{border:1px solid var(--line);background:var(--card);border-radius:6px;
              line-height:1;padding:2px 6px;font-size:11px;color:var(--muted)}
  .ticon{width:42px;height:42px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;font-size:19px;
         background:linear-gradient(135deg,#e6f0ff,#e0f7ff);border:1px solid #dbeafe}
  .cap{font-size:12px;color:var(--muted);margin-top:6px}
  .cap b{color:var(--text)}
  .full{color:var(--amber)}

  .scrim{position:fixed;inset:0;background:rgba(17,24,39,.35);display:none;z-index:40}
  .scrim.on{display:block}
  .panel{position:fixed;top:0;right:0;height:100vh;width:410px;max-width:93vw;background:var(--card);
         z-index:50;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;
         box-shadow:-8px 0 30px rgba(0,0,0,.10)}
  .panel.on{transform:none}
  .panel header,.modal header{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;
         display:flex;justify-content:space-between;align-items:center}
  .panel .body{padding:20px;overflow:auto;flex:1}
  .panel footer,.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:500px;max-width:94vw;
         background:var(--card);border-radius:14px;z-index:50;display:none;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal.on{display:block}
  .modal .body{padding:20px;max-height:66vh;overflow:auto}
  .x{border:0;background:none;font-size:20px;color:var(--muted);line-height:1;padding:0 4px}

  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
  .field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .mchip{background:var(--accent-soft);color:var(--accent);padding:4px 8px 4px 10px;border-radius:999px;
         font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .mchip button{border:0;background:none;color:inherit;font-size:14px;line-height:1;padding:0;opacity:.7}
  .drop{border:1px solid var(--line);border-radius:9px;margin-top:6px;max-height:170px;overflow:auto}
  .drop div{padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--line)}
  .drop div:last-child{border-bottom:0}
  .drop div:hover{background:var(--accent-soft)}
  .drop small{color:var(--muted)}
  textarea{width:100%;min-height:150px;padding:10px 11px;border:1px solid var(--line);border-radius:9px;
           font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;resize:vertical}

  .bars{display:flex;flex-direction:column;gap:10px}
  .bar-row{display:grid;grid-template-columns:210px 1fr 42px;gap:12px;align-items:center;font-size:13px}
  .track{background:var(--grey-bg);border-radius:6px;height:20px;overflow:hidden}
  .fill{height:100%;background:var(--accent);border-radius:6px}
  .bar-row .n{font-weight:700;text-align:right}
  .banner{background:var(--amber-bg);color:var(--amber);border:1px solid #fde68a;padding:9px 13px;
          border-radius:9px;font-size:12.5px;font-weight:600;display:inline-block}
  .info{background:var(--accent-soft);color:var(--accent);border:1px solid #c7d7fe;padding:10px 13px;
        border-radius:9px;font-size:12.5px;display:block;margin-bottom:16px}

  /* ---------- wall of fame ---------- */
  .hero{color:#fff;border-radius:16px;padding:28px 30px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;
        background-image:linear-gradient(135deg,#0b1222 0%,#1d4ed8 58%,#38bdf8 140%),
          repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 40px),
          repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 40px)}
  .hero img{height:104px;width:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
  .hero h1{color:#fff;font-family:var(--display);font-weight:400;font-size:40px;margin:0;letter-spacing:.02em}
  .hero p{margin:4px 0 0;opacity:.85;font-size:13.5px}
  .hero .tally{margin-left:auto;display:flex;gap:20px;text-align:center}
  .hero .tally div span{display:block;font-family:var(--display);font-size:35px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
  .hero .tally div small{opacity:.85;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}

  .photoband{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
             background:var(--card);margin:14px 0 6px}
  .photoband img{width:100%;display:block;max-height:360px;object-fit:cover}
  .photoband .tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
  .photoband .tools button{background:rgba(17,24,39,.72);color:#fff;border:0;border-radius:7px;
                           padding:5px 10px;font-size:12px;font-weight:600;backdrop-filter:blur(4px)}
  .photoband .cap2{padding:9px 14px;font-size:12.5px;color:var(--muted);display:flex;
                   justify-content:space-between;gap:10px;border-top:1px solid var(--line)}
  .dropzone{border:2px dashed var(--line);border-radius:14px;background:var(--card);
            padding:30px 20px;text-align:center;color:var(--muted);cursor:pointer;margin:14px 0 6px}
  .dropzone:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .dropzone .big{font-size:28px;line-height:1}
  .yearhead{display:flex;align-items:baseline;gap:12px;margin:34px 0 0;flex-wrap:wrap}
  .yearhead h2{font-size:20px;margin:0;letter-spacing:-.03em}
  .yearhead .t{color:var(--muted);font-size:13px}
  .fame{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
  .fcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);
         border-radius:12px;padding:14px 16px}
  .fcard.gold{border-left-color:#eab308;background:linear-gradient(90deg,#fffdf3,#fff 55%)}
  .fcard.silver{border-left-color:#94a3b8;background:linear-gradient(90deg,#f8fafc,#fff 55%)}
  .fcard.bronze{border-left-color:#c98a5b;background:linear-gradient(90deg,#fff8f2,#fff 55%)}
  .fcard.special{border-left-color:#a855f7;background:linear-gradient(90deg,#faf5ff,#fff 55%)}
  .fcard .res{font-weight:800;font-size:14px;letter-spacing:-.015em}
  .fcard .names{margin-top:6px;font-size:13.5px;line-height:1.45}
  .fcard .ev{margin-top:8px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:8px}

  /* ---------- sign-in gate & account ---------- */
  #gate{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:20px;
        background-image:linear-gradient(160deg,#0b1222 0%,#12203c 55%,#1d4ed8 160%),
          repeating-linear-gradient(90deg,rgba(56,189,248,.05) 0 1px,transparent 1px 38px),
          repeating-linear-gradient(0deg,rgba(56,189,248,.05) 0 1px,transparent 1px 38px)}
  #gate.on{display:grid}
  .gatecard{background:var(--card);border-radius:18px;padding:34px 30px;max-width:400px;width:100%;
            text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45)}
  .gatecard img{height:96px;margin-bottom:14px}
  .gatecard h2{font-family:var(--display);font-size:24px;margin:0 0 4px;letter-spacing:.02em}
  .gatecard p{color:var(--muted);font-size:13px;margin:0 0 20px}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;
        border:1px solid var(--line);border-radius:11px;background:var(--card);font-weight:700;font-size:14px}
  .gbtn:hover{background:var(--grey-bg)}
  .gerr{color:var(--red);font-size:12.5px;margin-top:14px;min-height:16px}

  .acct{padding:10px 8px 0;border-top:1px solid var(--line-dk);margin-top:12px;font-size:12px;color:#94a3b8}
  .acct .who{color:#e2e8f0;font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct .row2{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
  .acct button{background:rgba(148,163,184,.14);border:0;color:#cbd5e1;border-radius:7px;
               padding:4px 9px;font-size:11.5px;font-weight:600}
  .acct button:hover{background:rgba(148,163,184,.26);color:#fff}
  .rolepill{padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
  .r-edit{background:rgba(52,211,153,.18);color:#34d399}
  .r-view{background:rgba(148,163,184,.18);color:#cbd5e1}
  .r-demo{background:rgba(251,191,36,.18);color:#fbbf24}
  .savechip{position:fixed;right:16px;bottom:16px;z-index:60;background:var(--ink);color:#cbd5e1;
            padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;opacity:0;
            transition:opacity .25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .savechip.on{opacity:.95}

  @media print{
    .sidebar,.nav,.fab,.noprint{display:none !important}
    body{background:#fff}
    .main{padding:0;max-width:none}
    .hero{background:#1d4ed8 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .fcard{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .fame{grid-template-columns:1fr 1fr}
  }
  @media(max-width:860px){
    .app{flex-direction:column}
    .sidebar{width:100%;height:auto;position:sticky;top:0;z-index:30;padding:12px 12px 8px;
             border-right:0;border-bottom:1px solid var(--line-dk);overflow:visible}
    .brand{flex-direction:row;gap:13px;text-align:left;padding:0 0 12px;font-size:21px}
    .brand .logo{height:58px}
    .brand small{letter-spacing:.16em;margin-top:4px}
    .yearbox{border-bottom:0;padding:0 0 10px;margin-bottom:0}
    .yearbox select{max-width:180px}
    .nav{flex-direction:row;overflow-x:auto;gap:6px}
    .nav button{width:auto;white-space:nowrap;padding:6px 11px;gap:8px}
    .nav .ic{width:25px;height:25px;font-size:13px}
    .main{padding:18px 16px 90px}
    .hide-sm{display:none}
    .bar-row{grid-template-columns:120px 1fr 34px;font-size:12px}
    .hero{padding:20px}.hero h1{font-size:22px}.hero img{height:56px}
    .hero .tally{margin-left:0;width:100%;justify-content:space-between;gap:8px}
    .hero .tally div span{font-size:24px}
    .fab{position:fixed;right:18px;bottom:18px;z-index:35;border-radius:999px;padding:14px 20px;
         box-shadow:0 8px 24px rgba(29,78,216,.35)}
  }
  @media(min-width:861px){.fab{display:none}}
</style>
</head>

const $ = id => document.getElementById(id);

const entriesOf = cid => entries.filter(e => e.comp === cid && e.status !== 'Withdrawn');
const teamCount = c => Math.max(c.teams ?? 0, entriesOf(c.id).length);
const initials = n => n.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
const isPodium = r => PODIUM.includes(r);
const MEDAL = {'Champion / Johan':'gold','Platinum':'gold','Gold':'gold',
               'Silver':'silver','1st Runner-up':'silver',
               'Bronze':'bronze','2nd Runner-up':'bronze','3rd place / Tempat Ketiga':'bronze'};
const medalOf = r => MEDAL[r] || null;
function tally(cs){
  const t = {gold:0, silver:0, bronze:0, other:0};
  cs.forEach(c => entriesOf(c.id).forEach(e => {
    const m = medalOf(e.result);
    if(m) t[m]++; else if(e.result !== '—' || e.award) t.other++;
  }));
  t.medals = t.gold + t.silver + t.bronze;
  return t;
}
const medalLine = t => `🥇 ${t.gold} &nbsp;🥈 ${t.silver} &nbsp;🥉 ${t.bronze}`;
const typeOf = id => types.find(t => t.id === id) || {name:'Uncategorised', icon:'🎯'};
const plusIcon = () => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="3.2" stroke-linecap="round" style="vertical-align:-1px;margin-right:5px"><path d="M12 5v14M5 12h14"/></svg>`;
const typeTag = id => { const t = typeOf(id);
  return `<span class="lvl" style="background:var(--accent-soft);color:var(--accent);border-color:transparent">${t.icon} ${esc(t.name)}</span>`; };
const showDate = c => c.dateText || (c.date ? fmtDate(c.date) : 'No date');
const openToJoin = y => compsOf(y)
  .filter(c => c.status === 'Open' && (!c.deadline || daysLeft(c.deadline) >= 0))
  .sort((a,b) => (a.deadline || '9999').localeCompare(b.deadline || '9999')
              || (a.date || '9999').localeCompare(b.date || '9999'));
function closingBadge(c){
  if(!c.deadline) return '<span class="pill p-open">Open — ask your teacher</span>';
  const d = daysLeft(c.deadline);
  if(d < 0)   return '<span class="pill p-out">Closed</span>';
  if(d === 0) return '<span class="pill p-out">Closes today</span>';
  if(d <= 7)  return `<span class="pill p-closed">Closes in ${d} day${d===1?'':'s'}</span>`;
  return `<span class="pill p-done">Closes in ${d} days</span>`;
}
const normName = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function dupGroups(y){
  const map = {};
  compsOf(y).forEach(c => (map[normName(c.name)] ||= []).push(c));
  return Object.values(map).filter(g => g.length > 1);
}
const isDup = c => dupGroups(c.year).some(g => g.some(x => x.id === c.id));
const fmtDate = d => new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const daysLeft = d => Math.ceil((new Date(d) - TODAY) / 86400000);

function studentsIn(cid){
  const set = new Set(); entriesOf(cid).forEach(e => e.members.forEach(m => set.add(m))); return set.size;
}
function statusPill(s){
  const map = {Open:'p-open', Confirmed:'p-open', Ongoing:'p-closed', Completed:'p-done',
               Draft:'p-draft', Closed:'p-closed', Withdrawn:'p-out'};
  return `<span class="pill ${map[s]||'p-draft'}">${s}</span>`;
}
function resultCell(e){
  const r = e.result, medal = {'Champion / Johan':'🏆','Platinum':'🥇','Gold':'🥇','Silver':'🥈','Bronze':'🥉',
    '1st Runner-up':'🥈','2nd Runner-up':'🥉','Special Award':'⭐'}[r] || '';
  const main = (!r || r === '—') ? '<span style="color:var(--muted)">—</span>'
             : `<span style="font-weight:${isPodium(r)?600:400}">${medal} ${esc(r)}</span>`;
  return main + (e.award ? `<br><span class="award">${esc(e.award)}</span>` : '');
}
function yearStats(y){
  const cs = compsOf(y);
  const teams = cs.reduce((n,c) => n + teamCount(c), 0);
  const ids = new Set(); cs.forEach(c => entriesOf(c.id).forEach(e => e.members.forEach(m => ids.add(m))));
  const awards = cs.reduce((n,c) => n + entriesOf(c.id).filter(e => isPodium(e.result) || e.award).length, 0);
  return {comps:cs.length, teams, students:ids.size, awards, ...tally(cs)};
}

function renderChrome(){
  const active = state.view === 'competition' ? 'competitions' : state.view;
  $('nav').innerHTML = VIEWS.map(([k,i,l,c,cb]) =>
    `<button class="${k===active?'on':''}" style="--c:${c};--cb:${cb}" onclick="go('${k}')">
       <span class="ic">${i}</span>${l}</button>`).join('');
  $('yearsel').innerHTML = years.slice().sort((a,b)=>b-a)
      .map(y => `<option value="${y}" ${y===state.year?'selected':''}>${y}</option>`).join('')
    + `<option value="new">＋ Start a new year…</option>`;
}
function go(v, id){ state.view = v; state.compId = id ?? null; state.expanded = null; render(); window.scrollTo(0,0); }
function switchYear(v){
  if(v === 'new'){ newSession(); return; }
  state.year = +v; state.view = state.view === 'competition' ? 'competitions' : state.view;
  state.compId = null; render();
}
function newSession(){
  const suggested = Math.max(...years) + 1;
  const y = parseInt(prompt('Which year would you like to start?', suggested), 10);
  if(!y || isNaN(y)){ renderChrome(); return; }
  if(years.includes(y)){ alert(y + ' already exists.'); state.year = y; render(); return; }
  years.push(y);
  const prev = Math.max(...years.filter(x => x < y));
  if(compsOf(prev).length && confirm(
     `Bring the ${compsOf(prev).length} competitions from ${prev} into ${y} as drafts?\n\n` +
     `Names, types and levels carry over. Dates, team counts and results start fresh.`)){
    compsOf(prev).forEach(c => competitions.push({...c, id: nextId.comp++, year:y,
      date: c.date ? (y + c.date.slice(4)) : '', dateText:'', teams:0, status:'Draft'}));
  }
  state.year = y; state.view = 'competitions'; render();
}

  renderChrome();
  $('main').innerHTML =
    state.view === 'dashboard'    ? dashboard() :
    state.view === 'competitions' ? compList()  :

    state.view === 'wall'         ? wall() :
    state.view === 'settings'     ? settings() : reports();
  applyRole();
  updateAcct();
  scheduleSave();
}

/* ============================ 2. COMPETITION LIST ============================ */

      (state.level === 'All' || c.level === state.level) &&

  else rows.sort((a,b) => (b.date || '0').localeCompare(a.date || '0'));
  const drag = state.sort === 'custom';

  const total = yearComps().length;
  const dups = dupGroups(state.year);
  const extra = dups.reduce((n,g) => n + g.length - 1, 0);

     (state.q || state.level!=='All' || state.type!=='All' || state.status!=='All')
       ? ' <b class="full">Clear the filters first</b> — dragging a filtered list can be confusing.' : ''}</div>` : ''}
  <div class="card list">
    ${rows.map(c => {
      const named = entriesOf(c.id).length;
      return `<div class="item" onclick="go('competition',${c.id})"

        <div class="count">${teamCount(c)} <span>teams${named ? ` · ${named} named` : ''}</span></div>

/* ============================ 4. STUDENTS ============================ */
function studentList(){
  const rows = students.map(s => {
    const mine = entries.filter(e => e.members.includes(s.id) && e.status !== 'Withdrawn');
    const thisYear = mine.filter(e => (competitions.find(c => c.id === e.comp)||{}).year === state.year);
    return {...s, n:thisYear.length, all:mine.length, wins:mine.filter(e=>isPodium(e.result)).length};
  }).filter(s => s.name.toLowerCase().includes(state.q.toLowerCase()))
    .filter(s => state.sfilter === 'All' || (state.sfilter === 'Left' ? s.left : !s.left))
    .sort((a,b) => (a.left?1:0)-(b.left?1:0) || b.n - a.n || b.all - a.all);
  const nLeft = students.filter(s => s.left).length;

  return `
  <div class="spread">
    <div><h1>Students</h1><p class="sub">${students.length - nLeft} active${nLeft?` · ${nLeft} left the club`:''} — the namelist carries across every year.</p></div>
    <div class="row">
      <button class="btn" onclick="openImport()">⭱ Upload namelist</button>
      <button class="btn primary" onclick="openStudent()">${plusIcon()} Add student</button>
    </div>
  </div>
  <div class="row" style="margin-bottom:14px">
    <input class="search" placeholder="🔍  Search students…" value="${esc(state.q)}"
      oninput="state.q=this.value;render();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
    ${['Active','Left','All'].map(f=>`<button class="chip ${state.sfilter===f?'on':''}" onclick="state.sfilter='${f}';render()">${f}</button>`).join('')}

  <div class="card">
    <table>
      <thead><tr><th>Name</th><th class="hide-sm">Class</th><th>${state.year} entries</th><th class="hide-sm">All&#8209;time</th><th>Medals</th><th></th></tr></thead>
      <tbody>
      ${rows.map(s => `<tr class="entry" onclick="showStudent(${s.id})" style="${s.left?'opacity:.55':''}">
        <td><b>${esc(s.name)}</b> ${s.left?'<span class="pill p-draft">left</span>':''}</td>
        <td class="hide-sm" style="color:var(--muted)">${s.cls ? esc(s.cls) : '<span class="pill p-draft">add class</span>'}</td>
        <td>${s.n === 0 ? '<span class="pill p-out">not yet</span>' : s.n}</td>
        <td class="hide-sm">${s.all}</td>
        <td>${s.wins || '<span style="color:var(--muted)">—</span>'}</td>

          <button class="btn sm" onclick="event.stopPropagation();openStudent(${s.id})">✎</button>

                  onclick="event.stopPropagation();toggleLeft(${s.id})">${s.left?'↩':'⇥'}</button>
          <button class="btn sm danger" title="Delete permanently" onclick="event.stopPropagation();delStudent(${s.id})">✕</button></td>
      </tr>`).join('') || '<tr><td colspan="6" class="empty">No students yet — start with <b>Upload namelist</b>.</td></tr>'}

    </table>

/* --- what gets stored --- */
/* core = the bits worth comparing; updatedAt/By change every call so they stay out of it */
const packCore = () => ({years, types, teachers, students, competitions, entries, nextId});
const packData = () => ({...packCore(), updatedAt: Date.now(), updatedBy: me ? me.email : ''});
let lastSaved = null;
function unpackData(d){
  applying = true;
  if(Array.isArray(d.years))        years        = d.years;
  if(Array.isArray(d.types))        types        = d.types;
  if(Array.isArray(d.teachers))     teachers     = d.teachers;
  if(Array.isArray(d.students))     students     = d.students;
  if(Array.isArray(d.competitions)) competitions = d.competitions;
  if(Array.isArray(d.entries))      entries      = d.entries;
  if(d.nextId)                      nextId       = d.nextId;
  if(!years.includes(state.year)) state.year = Math.max(...years);
  applying = false;
}

function chip(msg, ms){
  const el = $('savechip'); if(!el) return;
  el.textContent = msg; el.classList.add('on');
  clearTimeout(chip._t); if(ms) chip._t = setTimeout(() => el.classList.remove('on'), ms);
}
function scheduleSave(){
  if(!db || !canEdit || applying) return;
  if(JSON.stringify(packCore()) === lastSaved) return;    /* nothing actually changed */
  clearTimeout(saveTimer);
  chip('Saving…');
  saveTimer = setTimeout(saveNow, 800);
}
function saveNow(){
  if(!db || !canEdit) return;
  lastSaved = JSON.stringify(packCore());                 /* remember before writing */
  db.collection('club').doc('data').set(packData())
    .then(() => chip('All changes saved', 1800))
    .catch(e => { lastSaved = null; chip('Not saved: ' + e.code, 6000); });
}
function savePhoto(y){
  if(!db || !canEdit) return;
  const ref = db.collection('photos').doc(String(y));
  (photos[y] ? ref.set(photos[y]) : ref.delete())
    .then(() => chip('Photo saved', 1800))
    .catch(e => chip('Photo not saved: ' + e.code, 6000));
}

/* --- auth --- */
function signIn(){
  const p = new firebase.auth.GoogleAuthProvider();
  if(SCHOOL_DOMAIN) p.setCustomParameters({hd: SCHOOL_DOMAIN, prompt: 'select_account'});
  firebase.auth().signInWithPopup(p).catch(e => { $('gerr').textContent = e.message; });
}
function signOut(){ firebase.auth().signOut(); }
function gate(show){ $('gate').classList.toggle('on', show); }

function bootCloud(){
  $('gatelogo').src = LOGO();
  $('gdomain').textContent = '@' + SCHOOL_DOMAIN;
  if(!cloudOn()){ updateAcct(); return; }           /* demo mode */

  firebase.initializeApp(FIREBASE);
  db = firebase.firestore();

  firebase.auth().onAuthStateChanged(async user => {
    me = user;
    if(!user){ canEdit = false; gate(true); updateAcct(); return; }
    if(SCHOOL_DOMAIN && !(user.email || '').toLowerCase().endsWith('@' + SCHOOL_DOMAIN)){
      $('gerr').textContent = 'That is not a school account. Please use @' + SCHOOL_DOMAIN;
      await firebase.auth().signOut(); return;
    }
    try{
      const roles = await db.collection('config').doc('roles').get();
      const list = ((roles.data() || {}).teachers || []).map(e => String(e).toLowerCase());
      canEdit = list.includes(user.email.toLowerCase());
    }catch(e){ canEdit = false; }
    gate(false);
    listen();
    updateAcct();
  });
}

function listen(){
  db.collection('club').doc('data').onSnapshot(snap => {
    if(snap.exists){
      unpackData(snap.data());
      lastSaved = JSON.stringify(packCore());   /* in step with the server — do not write it back */
      render();
    }
    else if(canEdit){ chip('Setting up your club data…'); saveNow(); }
  }, e => chip('Cannot read data: ' + e.code, 8000));

  db.collection('photos').onSnapshot(qs => {
    applying = true; photos = {};
    qs.forEach(d => photos[d.id] = d.data());
    applying = false; render();
  }, () => {});
}

/* --- account strip in the sidebar --- */

/* --- view-only: strip every editing control after each render --- */
const EDIT_FNS = /^(toggleOpen|openComp|openGroup|delComp|delGroup|openStudent|delStudent|toggleLeft|duplicateComp|saveComp|saveGroup|saveStudent|addType|renameType|changeIcon|delType|addTeacher|renameTeacher|delTeacher|addTeacherInline|newTypeInline|newSession|pickPhoto|removePhoto|captionPhoto|moveComp|openImport|runImport|openDupes|resetOrder|setSort)\b/;
function applyRole(){
  if(canEdit || !cloudOn()) return;
  document.querySelectorAll('#main [onclick], .panel [onclick]').forEach(el => {
    const fn = (el.getAttribute('onclick') || '').trim();
    if(EDIT_FNS.test(fn)) el.remove();
  });
  document.querySelectorAll('.grip, .ord, .fab, .dropzone').forEach(el => el.remove());
  const sel = $('yearsel');
  if(sel) [...sel.options].forEach(o => { if(o.value === 'new') o.remove(); });
}

/* ============================ WALL OF FAME ============================ */
const LOGO = () => { const el = document.querySelector('.brand .logo'); return el ? el.src : ''; };
let photos = {};            /* year -> {src, cap} */

function pickPhoto(y){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1500, sc = Math.min(1, max / img.width);
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        photos[y] = {src: cv.toDataURL('image/jpeg', 0.78), cap: (photos[y]||{}).cap || ''};
        render(); savePhoto(y);
      };
      img.onerror = () => alert('That file could not be read as an image.');
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}
function removePhoto(y){ if(confirm(`Remove the ${y} photo?`)){ delete photos[y]; render(); savePhoto(y); } }
function captionPhoto(y){
  const c = prompt(`Caption for the ${y} photo:`, (photos[y]||{}).cap || '');

function wall(){
  const all = state.wallAll;
  const cs = all ? competitions.slice() : yearComps();
  const t = tally(cs);

  const wins = [];
  cs.forEach(c => entriesOf(c.id).forEach(e => {
    const m = medalOf(e.result);
    if(m || e.award || (e.result !== '—' && e.result !== 'Participation')) wins.push({c, e, m});
  }));
  const rank = {gold:0, silver:1, bronze:2};
  wins.sort((a,b) => (rank[a.m] ?? 3) - (rank[b.m] ?? 3) || (b.c.date||'').localeCompare(a.c.date||''));

  const scope = all ? 'All years' : state.year;
  const winsOf = y => { const w = [];
    compsOf(y).forEach(c => entriesOf(c.id).forEach(e => { const m = medalOf(e.result);
      if(m || e.award || (e.result !== '—' && e.result !== 'Participation')) w.push({c, e, m}); }));
    return w.sort((a,b) => ({gold:0,silver:1,bronze:2}[a.m] ?? 3) - ({gold:0,silver:1,bronze:2}[b.m] ?? 3));
  };
  const card = ({c,e,m}) => `<div class="fcard ${m || 'special'}">
      <div class="res">${{gold:'🥇',silver:'🥈',bronze:'🥉'}[m] || '⭐'} ${esc(e.result === '—' ? (e.award || 'Special award') : e.result)}</div>
      <div class="names">${e.members.length
          ? e.members.map(id => `<b>${esc(student(id).name)}</b>${student(id).cls ? ` <span style="color:var(--muted)">${esc(student(id).cls)}</span>` : ''}`).join('<br>')
          : `<span style="color:var(--muted)">${esc(e.name)} — names not recorded</span>`}</div>
      ${e.award && e.result !== '—' ? `<div style="margin-top:6px"><span class="award">${esc(e.award)}</span></div>` : ''}
      <div class="ev">${typeOf(c.type).icon} ${esc(c.name)} · ${c.level}${all ? ' · ' + c.year : ''}</div>
    </div>`;

  const section = (key, title) => {
    const g = wins.filter(w => (key === 'special' ? !w.m : w.m === key));
    return g.length ? `<h2>${title} <span style="color:var(--muted);font-weight:500">· ${g.length}</span></h2>
      <div class="fame">${g.map(card).join('')}</div>` : '';
  };

  return `
  <div class="hero">
    ${LOGO() ? `<img src="${LOGO()}" alt="">` : ''}
    <div>
      <h1>Wall of Fame</h1>
      <p>STEM Club SMK Lutong · ${scope}</p>
    </div>
    <div class="tally">
      <div><span>${t.gold}</span><small>Gold</small></div>
      <div><span>${t.silver}</span><small>Silver</small></div>
      <div><span>${t.bronze}</span><small>Bronze</small></div>
      <div><span>${wins.filter(w => !w.m).length}</span><small>Special</small></div>
    </div>
  </div>

  <div class="row noprint" style="margin:16px 0 4px">
    <button class="chip ${!all?'on':''}" onclick="state.wallAll=false;render()">${state.year} only</button>
    <button class="chip ${all?'on':''}" onclick="state.wallAll=true;render()">All years</button>
    <button class="btn sm" style="margin-left:auto" onclick="window.print()">🖨 Print for notice board</button>
  </div>

  ${all ? years.slice().sort((a,b) => b - a).map(y => { const w = winsOf(y), tt = tally(compsOf(y));
      return `<div class="yearhead"><h2>${y}</h2>
        <span class="t">🥇 ${tt.gold} · 🥈 ${tt.silver} · 🥉 ${tt.bronze} · ${compsOf(y).length} competitions</span></div>
      ${photoBand(y)}
      ${w.length ? `<div class="fame" style="margin-top:12px">${w.map(card).join('')}</div>`
                 : '<div class="card empty">No achievements recorded for ' + y + ' yet.</div>'}`;}).join('')
    + `<div class="row noprint" style="margin-top:26px">
         <button class="btn" onclick="newSession()">${plusIcon()} Add a year</button>
       </div>`
   : `
  ${photoBand(state.year)}

  ${section('gold','🥇 Gold')}
  ${section('silver','🥈 Silver')}
  ${section('bronze','🥉 Bronze')}
  ${section('special','⭐ Special awards &amp; finalists')}
  ${wins.length ? '' : '<div class="card empty" style="margin-top:20px">No achievements recorded for this year yet.</div>'}
  `}`;
}

/* --- custom ordering of the competition list --- */
function ensureOrd(y){
  const cs = compsOf(y);
  if(cs.some(c => typeof c.ord !== 'number')){
    cs.slice().sort((a,b) => (b.date||'0').localeCompare(a.date||'0'))
      .forEach((c,i) => c.ord = i);
  }
}
function setSort(s){ if(s === 'custom') ensureOrd(state.year); state.sort = s; render(); }
function resetOrder(){
  compsOf(state.year).forEach(c => delete c.ord);
  state.sort = 'date'; render();
}
function orderedComps(y){ ensureOrd(y); return compsOf(y).slice().sort((a,b) => a.ord - b.ord); }
function moveComp(id, dir){
  const list = orderedComps(state.year);
  const i = list.findIndex(c => c.id === id), j = i + dir;
  if(j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((c,k) => c.ord = k);
  render();
}
function dragStart(ev, id){
  dragId = id; ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain', String(id)); }catch(e){}
  ev.currentTarget.classList.add('dragging');
}
function dragOver(ev){
  if(dragId === null) return;
  ev.preventDefault(); ev.dataTransfer.dropEffect = 'move';
  const r = ev.currentTarget.getBoundingClientRect();
  const top = (ev.clientY - r.top) < r.height/2;
  ev.currentTarget.classList.toggle('over-top', top);
  ev.currentTarget.classList.toggle('over-bot', !top);
}
function dragLeave(ev){ ev.currentTarget.classList.remove('over-top','over-bot'); }
function dragEnd(ev){
  dragId = null;
  document.querySelectorAll('.item').forEach(el => el.classList.remove('dragging','over-top','over-bot'));
}
function dropComp(ev, targetId){
  ev.preventDefault();
  const r = ev.currentTarget.getBoundingClientRect();
  const before = (ev.clientY - r.top) < r.height/2;
  ev.currentTarget.classList.remove('over-top','over-bot');
  if(dragId === null || dragId === targetId){ dragEnd(ev); return; }
  const list = orderedComps(state.year);
  const from = list.findIndex(c => c.id === dragId);
  const [moved] = list.splice(from, 1);
  let to = list.findIndex(c => c.id === targetId);
  if(!before) to++;
  list.splice(to, 0, moved);
  list.forEach((c,k) => c.ord = k);
  dragId = null; render();
}

/* --- namelist upload: Excel / Word / CSV --- */
const NAME_HDR = /^(nama|name|nama penuh|full name|student|students|murid|pelajar|nama murid|nama pelajar)$/i;
const CLS_HDR  = /^(kelas|class|tingkatan|form|darjah|year)$/i;
const NUM_HDR  = /^(no|no\.|bil|bil\.|#|num|number)$/i;

function cleanName(s){
  return String(s ?? '').replace(/\s+/g,' ').trim()
         .replace(/^\d+\s*[.)\-:]\s*/,'').replace(/[,;]+$/,'').trim();
}
function mapRows(rows){
  rows = rows.map(r => r.map(c => String(c ?? '').trim())).filter(r => r.some(c => c));
  if(!rows.length) return [];
  let nameIdx = -1, clsIdx = -1, start = 0;
  const head = rows[0];
  head.forEach((c,i) => { if(NAME_HDR.test(c)) nameIdx = i; if(CLS_HDR.test(c)) clsIdx = i; });
  if(nameIdx >= 0){ start = 1; if(clsIdx < 0) clsIdx = nameIdx + 1; }
  else {
    const numCol = head.length > 1 && (NUM_HDR.test(head[0]) || /^\d+$/.test(head[0]));
    if(NUM_HDR.test(head[0])) start = 1;
    nameIdx = numCol ? 1 : 0; clsIdx = numCol ? 2 : 1;
  }
  return rows.slice(start)
    .map(r => ({name: cleanName(r[nameIdx]), cls: String(r[clsIdx] ?? '').trim()}))
    .filter(r => r.name && !NAME_HDR.test(r.name) && !NUM_HDR.test(r.name));
}
function openImport(){ importText = ''; drawImport(); openScrim(); $('panel').classList.add('on'); }
function parseNamelist(txt){ return mapRows(txt.split(/\r?\n/).map(l => l.split(/[,\t;]/))); }
function fstat(msg){ if($('fstat')) $('fstat').innerHTML = msg; }
function toTextarea(rows, note){
  importText = rows.map(r => r.cls ? `${r.name}, ${r.cls}` : r.name).join('\n');
  drawImport(); fstat(`<b>✓ ${esc(note)}</b>`);
}
function drawImport(){
  const rows = parseNamelist(importText);
  const dupes = rows.filter(r => students.some(s => s.name.toLowerCase() === r.name.toLowerCase()));
  $('panel').innerHTML = `
    <header>Upload namelist<button class="x" onclick="closeAll()">✕</button></header>
    <div class="body">
      <p class="sub">One student per line: <b>Name, Class</b></p>
      <div class="field"><label>Choose a file</label>
        <input type="file" accept=".xlsx,.xls,.csv,.txt,.docx" onchange="readFile(this)">
        <div class="cap">Excel <b>.xlsx / .xls</b> · Word <b>.docx</b> · <b>.csv</b> · <b>.txt</b> — read on this device, nothing is uploaded.</div>
        <div id="fstat" class="cap"></div></div>
      <div class="field"><label>…or paste from Excel / Google Sheets</label>

                  oninput="importText=this.value;previewOnly()">${esc(importText)}</textarea>
        <div class="cap">File contents land here so you can fix mistakes first. Header rows and "Bil./No." columns are skipped.</div></div>
      <div id="preview">${importPreview(rows, dupes)}</div>
    </div>
    <footer><button class="btn" onclick="closeAll()">Cancel</button>
      <button class="btn primary" ${rows.length?'':'disabled style="opacity:.5"'} onclick="runImport()">
        Import ${rows.length - dupes.length} student${rows.length - dupes.length===1?'':'s'}</button></footer>`;
}
function importPreview(rows, dupes){
  if(!rows.length) return '';
  return `<div class="card" style="margin-top:6px">
      <div class="pad" style="border-bottom:1px solid var(--line)">
        <b>Preview — ${rows.length} row${rows.length===1?'':'s'}</b>
        ${dupes.length ? `<div class="cap full">${dupes.length} already on the namelist, will be skipped.</div>` : ''}</div>
      <table><tbody>
      ${rows.slice(0,12).map(r => {
        const dup = students.some(s => s.name.toLowerCase() === r.name.toLowerCase());
        return `<tr><td>${esc(r.name)}</td><td style="color:var(--muted)">${esc(r.cls) || '—'}</td>
          <td style="text-align:right">${dup ? '<span class="pill p-draft">duplicate</span>' : '<span class="pill p-done">new</span>'}</td></tr>`;
      }).join('')}
      ${rows.length > 12 ? `<tr><td colspan="3" style="color:var(--muted)">…and ${rows.length-12} more</td></tr>` : ''}
      </tbody></table></div>`;
}
function previewOnly(){
  const rows = parseNamelist(importText);
  const dupes = rows.filter(r => students.some(s => s.name.toLowerCase() === r.name.toLowerCase()));
  $('preview').innerHTML = importPreview(rows, dupes);
  const btn = $('panel').querySelector('footer .primary');
  const n = rows.length - dupes.length;
  btn.textContent = `Import ${n} student${n===1?'':'s'}`;
  btn.disabled = !rows.length; btn.style.opacity = rows.length ? 1 : .5;
}
function readFile(input){
  const f = input.files[0]; if(!f) return;
  const ext = f.name.split('.').pop().toLowerCase();
  fstat('Reading ' + esc(f.name) + '…');

  if(ext === 'xlsx' || ext === 'xls'){
    if(typeof XLSX === 'undefined'){ fstat('<span class="full">Excel reader did not load (no internet). Save as CSV and retry.</span>'); return; }
    const r = new FileReader();
    r.onload = ev => { try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        const sheet = wb.SheetNames[0];
        const rows = mapRows(XLSX.utils.sheet_to_json(wb.Sheets[sheet], {header:1, blankrows:false, defval:''}));
        if(!rows.length){ fstat('<span class="full">No names found in sheet "'+esc(sheet)+'".</span>'); return; }
        toTextarea(rows, `${rows.length} names read from sheet "${sheet}"` +
          (wb.SheetNames.length > 1 ? ` (first of ${wb.SheetNames.length} sheets)` : ''));
      }catch(err){ fstat('<span class="full">Could not read that Excel file: '+esc(err.message)+'</span>'); } };
    r.readAsArrayBuffer(f);

  } else if(ext === 'docx'){
    if(typeof mammoth === 'undefined'){ fstat('<span class="full">Word reader did not load (no internet). Paste the list below instead.</span>'); return; }
    const r = new FileReader();
    r.onload = ev => {
      mammoth.convertToHtml({arrayBuffer: ev.target.result}).then(res => {
        const doc = new DOMParser().parseFromString(res.value, 'text/html');
        const trs = [...doc.querySelectorAll('table tr')];
        const rows = trs.length
          ? mapRows(trs.map(tr => [...tr.querySelectorAll('td,th')].map(td => td.textContent)))
          : mapRows([...doc.querySelectorAll('p,li')].map(p => p.textContent.split(/[,\t;]|\s{2,}| - /).map(s => s.trim())));
        if(!rows.length){ fstat('<span class="full">No names found in that document.</span>'); return; }
        toTextarea(rows, `${rows.length} names read from ${trs.length ? 'the table in ' : ''}${f.name}`);
      }).catch(err => fstat('<span class="full">Could not read that Word file: '+esc(err.message)+'</span>'));
    };
    r.readAsArrayBuffer(f);

  } else if(ext === 'doc'){
    fstat('<span class="full">Old .doc format is not supported — open in Word and "Save As" .docx.</span>');

  } else {
    const r = new FileReader();
    r.onload = ev => toTextarea(mapRows(ev.target.result.split(/\r?\n/).map(l => l.split(/[,\t;]/))), `${f.name} read`);
    r.readAsText(f);
  }
}
function runImport(){
  let added = 0;
  parseNamelist(importText).forEach(r => {
    if(students.some(s => s.name.toLowerCase() === r.name.toLowerCase())) return;
    students.push({id: nextId.student++, name:r.name, cls:r.cls}); added++;
  });
  closeAll(); render();
  alert(`${added} student${added===1?'':'s'} added to the namelist.`);
}

/* --- Excel export: achievements report --- */
function exportAchievements(year){
  if(typeof XLSX === 'undefined'){
    alert('The Excel writer needs an internet connection the first time. Use the CSV button instead, or reconnect and retry.');
    return;
  }
  const cs = (year ? compsOf(year) : competitions.slice())
             .sort((a,b) => a.year - b.year || (a.date||'').localeCompare(b.date||''));

  /* Sheet 1 — one row per student per achievement */
  const s1 = [['Bil.','Tahun','Pertandingan','Jenis','Peringkat','Tarikh','Guru Pengiring','Kumpulan',
               'Nama Pelajar','Kelas','Pencapaian','Pingat','Anugerah Khas','Idea Projek']];
  let n = 0;
  cs.forEach(c => allEntriesOf(c.id).forEach(e => {
    if(!isPodium(e.result) && !e.award) return;
    const m = medalOf(e.result);
    const medal = m ? {gold:'Emas',silver:'Perak',bronze:'Gangsa'}[m] : '';
    const base = [c.year, c.name, typeOf(c.type).name, c.level, showDate(c),
                  teacherLabel(e.teacher || c.teacher), e.name];
    const tail = [e.result === '—' ? '' : e.result, medal, e.award || '', e.idea || ''];
    if(e.members.length) e.members.forEach(id =>
        s1.push([++n, ...base, student(id).name, student(id).cls, ...tail]));
    else s1.push([++n, ...base, '(nama belum direkod)', '', ...tail]);
  }));

  /* Sheet 2 — medal tally by competition type */
  const s2 = [['Jenis Pertandingan','Emas','Perak','Gangsa','Lain-lain','Jumlah']];
  types.forEach(t => { const tt = tally(cs.filter(c => c.type === t.id));
    if(tt.medals || tt.other) s2.push([t.name, tt.gold, tt.silver, tt.bronze, tt.other, tt.medals + tt.other]); });
  const T = tally(cs);
  s2.push(['JUMLAH', T.gold, T.silver, T.bronze, T.other, T.medals + T.other]);
  s2.push([]);
  s2.push(['Peringkat','Emas','Perak','Gangsa','Lain-lain','Jumlah']);
  LEVELS.forEach(l => { const tt = tally(cs.filter(c => c.level === l));
    if(tt.medals || tt.other) s2.push([l, tt.gold, tt.silver, tt.bronze, tt.other, tt.medals + tt.other]); });
  if(teachers.length){
    s2.push([]);
    s2.push(['Guru Pengiring','Emas','Perak','Gangsa','Lain-lain','Jumlah']);
    teachers.forEach(t => {
      let g=0,si=0,b=0,o=0;
      cs.forEach(c => entriesOf(c.id).forEach(e => {
        if((e.teacher || c.teacher) !== t.id) return;
        const m = medalOf(e.result);
        if(m==='gold') g++; else if(m==='silver') si++; else if(m==='bronze') b++;
        else if(e.result !== '—' || e.award) o++;
      }));
      if(g+si+b+o) s2.push([t.name, g, si, b, o, g+si+b+o]);
    });
  }

  /* Sheet 3 — per student */
  const s3 = [['Nama Pelajar','Kelas','Emas','Perak','Gangsa','Jumlah Pingat','Penyertaan']];
  students.map(st => {
    let g=0,si=0,b=0,ent=0;
    cs.forEach(c => entriesOf(c.id).forEach(e => {
      if(!e.members.includes(st.id)) return;
      ent++; const m = medalOf(e.result);
      if(m === 'gold') g++; else if(m === 'silver') si++; else if(m === 'bronze') b++;
    }));
    return {st, g, si, b, ent};
  }).filter(r => r.ent)
    .sort((a,b2) => (b2.g*3+b2.si*2+b2.b) - (a.g*3+a.si*2+a.b) || b2.ent - a.ent)
    .forEach(r => s3.push([r.st.name + (r.st.left ? ' (left)' : ''), r.st.cls, r.g, r.si, r.b, r.g+r.si+r.b, r.ent]));

  const wb = XLSX.utils.book_new();
  const mk = (aoa, widths, name) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = widths.map(w => ({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  mk(s1, [5,7,38,14,13,18,22,20,30,14,24,8,26,40], 'Pencapaian');
  mk(s2, [22,8,8,8,11,9], 'Ringkasan');
  mk(s3, [30,14,8,8,8,13,12], 'Mengikut Pelajar');
  XLSX.writeFile(wb, `Pencapaian STEM SMK Lutong ${year || 'semua tahun'}.xlsx`);
}

/* --- CSV export --- */
function exportCsv(year){
  const cs = year ? compsOf(year) : competitions.slice();
  const rows = [['Session','Bil.','Pertandingan','Type','Tarikh','Level','Penyertaan (teams)',
                 'Team','Members','Guru','Status','Pencapaian','Award','Idea']];
  cs.sort((a,b) => a.year - b.year || (a.date||'').localeCompare(b.date||''));
  cs.forEach((c,i) => {
    const es = allEntriesOf(c.id);
    if(!es.length) rows.push([c.year, i+1, c.name, typeOf(c.type).name, showDate(c), c.level, teamCount(c),
        '', '', teacherLabel(c.teacher), c.status, '', '', '']);
    es.forEach(e => rows.push([c.year, i+1, c.name, typeOf(c.type).name, showDate(c), c.level, teamCount(c),
        e.name, e.members.map(m => student(m).name).join('; '),
        teacherLabel(e.teacher || c.teacher), e.status, e.result, e.award, e.idea || '']));
  });
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `stem-club-smk-lutong-${year || 'all-sessions'}.csv`; a.click();
}
